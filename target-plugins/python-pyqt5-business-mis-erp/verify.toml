[profiles.python-pyqt5-business-mis-erp]
format = [
  "if [ -f scripts/claude-harness/run-if-module.py ]; then python3 scripts/claude-harness/run-if-module.py ruff \"python3 -m ruff format .\"; else python3 scripts/run-if-module.py ruff \"python3 -m ruff format .\"; fi"
]
check = [
  "python3 -m compileall -q . -x \"(^|/)(\\.git|\\.venv|venv|build|dist|__pycache__|\\.claude/state)(/|$)\"",
  "if [ -f scripts/claude-harness/check-harness.py ]; then python3 scripts/claude-harness/check-harness.py; else python3 scripts/check-harness.py; fi",
  "if [ -f scripts/claude-harness/run-if-module.py ]; then python3 scripts/claude-harness/run-if-module.py ruff \"python3 -m ruff check .\"; else python3 scripts/run-if-module.py ruff \"python3 -m ruff check .\"; fi",
  "if [ -f scripts/claude-harness/run-if-module.py ]; then python3 scripts/claude-harness/run-if-module.py mypy \"python3 -m mypy .\"; else python3 scripts/run-if-module.py mypy \"python3 -m mypy .\"; fi"
]
test = [
  "if [ -f scripts/claude-harness/run-if-module.py ]; then QT_QPA_PLATFORM=offscreen python3 scripts/claude-harness/run-if-module.py --required pytest \"python3 -m pytest -q\"; else QT_QPA_PLATFORM=offscreen python3 scripts/run-if-module.py --required pytest \"python3 -m pytest -q\"; fi"
]
pre_push = [
  "git diff --check"
]
